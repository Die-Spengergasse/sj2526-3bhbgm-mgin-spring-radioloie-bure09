<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            color: #1a1a1a;
        }
        .hero {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 50px 0;
            margin-bottom: 40px;
        }
        .card {
            border: 2px solid #1a1a1a;
            border-radius: 0;
            transition: all 0.2s ease;
        }
        .card:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .card:hover a {
            color: #ffffff;
        }
        .card a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }
        .date-badge {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 5px 15px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="hero text-center">
    <h1 class="display-4 fw-bold">Radiology System</h1>
    <p class="lead">Patient & Device Management</p>
</div>

<div class="container">

    <div class="text-center mb-4">
        <span class="date-badge">📅 <span th:text="${today}"></span></span>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div style="font-size: 40px;">🧑‍⚕️</div>
                <h5 class="mt-2">Patients</h5>
                <a href="/patient/list">View Patient List →</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div style="font-size: 40px;">🖥️</div>
                <h5 class="mt-2">Devices</h5>
                <a href="/device/list">View Device List →</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div style="font-size: 40px;">📋</div>
                <h5 class="mt-2">Reservations</h5>
                <a href="/reservation/list">View Reservation List →</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>
