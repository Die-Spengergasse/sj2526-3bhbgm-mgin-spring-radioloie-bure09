<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f8f8; color: #1a1a1a; }
        .page-header { background-color: #1a1a1a; color: #ffffff; padding: 30px 0; margin-bottom: 40px; }
        .form-label { font-weight: bold; }
        .form-control:focus { border-color: #1a1a1a; box-shadow: 0 0 0 0.2rem rgba(0,0,0,0.2); }
        .btn-save { background-color: #1a1a1a; color: #ffffff; border: none; width: 100%; padding: 10px; font-weight: bold; }
        .btn-save:hover { background-color: #444; color: #ffffff; }
        .btn-back { border: 2px solid #1a1a1a; color: #1a1a1a; width: 100%; padding: 10px; font-weight: bold; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
        .btn-back:hover { background-color: #1a1a1a; color: #ffffff; }
        .card { border: 2px solid #1a1a1a; border-radius: 0; padding: 30px; }
    </style>
</head>
<body>

<div class="page-header text-center">
    <h1 class="fw-bold">Add Reservation</h1>
</div>

<div class="container" style="max-width: 600px;">
    <div class="card">
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        <form th:action="@{/reservation/add}" method="post">

            <div class="mb-3">
                <label class="form-label">Patient</label>
                <select name="patientId" class="form-control">
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name + ' ' + p.surname}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Device</label>
                <select name="deviceId" class="form-control">
                    <option value="">-- Select Device --</option>
                    <option th:each="d : ${devices}" th:value="${d.id}" th:text="${d.type}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Start Time</label>
                <input type="datetime-local" name="startTime" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">End Time</label>
                <input type="datetime-local" name="endTime" class="form-control">
            </div>

            <div class="mb-3">
                <button type="submit" class="btn-save">Save Reservation</button>
            </div>

            <a href="/" class="btn-back">← Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
