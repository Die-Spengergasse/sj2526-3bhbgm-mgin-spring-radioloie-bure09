<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            color: #1a1a1a;
        }

        .page-header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 30px 0;
            margin-bottom: 40px;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control:focus {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 0.2rem rgba(0,0,0,0.2);
        }

        .btn-save {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }

        .btn-save:hover {
            background-color: #444;
            color: #ffffff;
        }

        .btn-back {
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-back:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .card {
            border: 2px solid #1a1a1a;
            border-radius: 0;
            padding: 30px;
        }

        .error-box {
            background-color: #1a1a1a;
            color: white;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 5px solid red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="page-header text-center">
    <h1 class="fw-bold">Add New Patient</h1>
</div>

<div class="container" style="max-width: 600px;">
    <div class="card">

        <div th:if="${error}" class="error-box">
            ⚠ <span th:text="${error}"></span>
        </div>

        <form th:action="@{/patient/add}" th:object="${patient}" method="post">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       placeholder="Patient name">
            </div>

            <div class="mb-3">
                <label class="form-label">Surname</label>
                <input type="text"
                       th:field="*{surname}"
                       class="form-control"
                       placeholder="Patient surname">
            </div>

            <div class="mb-3">
                <label class="form-label">Social Security Number</label>
                <input type="text"
                       th:field="*{socialsecuritynumber}"
                       class="form-control"
                       placeholder="Patient SSN">
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select th:field="*{gender}" class="form-control">
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Divers">Divers</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Birthdate</label>
                <input type="date"
                       th:field="*{birth}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <button type="submit" class="btn-save">
                    Save Patient
                </button>
            </div>

            <div>
                <a href="/" class="btn-back">
                    ← Back
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
