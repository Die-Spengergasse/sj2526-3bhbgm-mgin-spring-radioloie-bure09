<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservation List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            color: #1a1a1a;
        }
        .page-header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 30px 0;
            margin-bottom: 40px;
        }
        .table {
            border: 2px solid #1a1a1a;
        }
        .table thead {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .table tbody tr:hover {
            background-color: #e0e0e0;
        }
        .btn-dark-custom {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-dark-custom:hover {
            background-color: #444;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="page-header text-center">
    <h1 class="fw-bold">Reservation List</h1>
</div>

<div class="container">
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Patient</th>
            <th>Device</th>
            <th>Start</th>
            <th>End</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.patient.name + ' ' + r.patient.surname}"></td>
            <td th:text="${r.device.type}"></td>
            <td th:text="${r.startTime}"></td>
            <td th:text="${r.endTime}"></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/reservation/add}" class="btn-dark-custom">+ Neue Reservierung</a>
</div>

</body>
</html>
