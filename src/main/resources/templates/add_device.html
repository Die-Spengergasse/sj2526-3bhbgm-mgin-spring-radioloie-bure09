<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Device</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            color: #1a1a1a;
        }
        .page-header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 30px 0;
            margin-bottom: 40px;
        }
        .form-label {
            font-weight: bold;
        }
        .form-control:focus {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 0.2rem rgba(0,0,0,0.2);
        }
        .btn-save {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }
        .btn-save:hover {
            background-color: #444;
            color: #ffffff;
        }
        .btn-back {
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn-back:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .card {
            border: 2px solid #1a1a1a;
            border-radius: 0;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="page-header text-center">
    <h1 class="fw-bold">Add New Device</h1>
</div>

<div class="container" style="max-width: 600px;">
    <div class="card">
        <form th:action="@{/device/add}" th:object="${device}" method="post">

            <div class="mb-3">
                <label class="form-label">Type</label>
                <input type="text" th:field="*{type}" class="form-control" placeholder="Device type">
            </div>

            <div class="mb-3">
                <label class="form-label">Room Number</label>
                <input type="text" th:field="*{roomnumber}" class="form-control" placeholder="Room number">
            </div>

            <div class="mb-3">
                <button type="submit" class="btn-save">Save Device</button>
            </div>

            <div>
                <a href="/device/list" class="btn-back">← Back</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
